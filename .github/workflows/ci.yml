name: CI

on:
  push:
    branches:
      - '**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        run: mise run setup:ci

      - name: Run checks
        run: mise run check

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: mise run e2e

  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@v5

      - name: Check commit messages
        env:
          REF_NAME: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$REF_NAME" == release-please--* ]]; then
            echo "release-please branch: пропускаем проверку тикетов"
          elif [ "$REF_NAME" = "main" ]; then
            if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              python scripts/check_commits.py --message "$(git log -1 --format=%B)" --no-ticket
            else
              python scripts/check_commits.py --range "$BEFORE_SHA..$CURRENT_SHA" --no-ticket
            fi
          else
            git fetch --no-tags origin main
            python scripts/check_commits.py --range origin/main..HEAD
          fi

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag call-scheduler .

      - name: Run container and check health
        run: |
          docker run --detach --name call-scheduler --env PORT=8000 --publish 8000:8000 call-scheduler
          ready=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Приложение не ответило на /health" >&2
            docker logs call-scheduler
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:8000/ > /dev/null

      - name: Stop container
        if: always()
        run: docker rm --force call-scheduler || true
