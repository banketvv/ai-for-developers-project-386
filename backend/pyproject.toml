[project]
name = "backend"
version = "0.1.0"
description = "Backend for call scheduler"
readme = "README.md"
authors = [
    { name = "banketvv", email = "banket@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.162.4",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
    "datamodel-code-generator>=0.95.0",
    "pyyaml>=6.0.3",
    "openapi-spec-validator>=0.9.0",
    "types-pyyaml>=6.0.12.20261113",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.ruff]
target-version = "py313"
line-length = 99
extend-exclude = ["migrations", "app/schemas/contract.py"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "ASYNC",  # flake8-async
    "RUF",    # ruff-specific rules
]
# Русский текст в докстрингах и сообщениях API: кириллические буквы, похожие
# на латинские, — не ошибка, а нормальный алфавит.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
exclude = ["migrations"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
